name: loghub agent
version: "1.0.1"
slug: loghub_agent
description: Wysyła logi i stan Home Assistant OS do centrali loghub
url: https://github.com/Seelf/loghub
arch:
  - amd64
  - aarch64
init: false
boot: auto
startup: services
# odczyt dziennika systemowego HAOS (tylko odczyt) i stanu dodatkow przez API Supervisora
journald: true
hassio_api: true
hassio_role: default
homeassistant_api: true
options:
  hub: ""
  token: ""
  name: haos
schema:
  hub: str
  token: password
  name: "match(^[A-Za-z0-9._-]+$)"
