<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Status usług</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--line:#dde3e8;--fg:#172027;--mut:#5d6b76;--ok:#1f9d6b;--part:#d98e04;--down:#d23f31;--none:#d5dce2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1214;--card:#171b1f;--line:#262d33;--fg:#e2e8ec;--mut:#8b98a3;--ok:#3ecf9a;--part:#f0b85a;--down:#ff7b72;--none:#2c343b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:40px 20px 60px}
h1{font-size:26px;margin:0 0 22px;font-weight:650;letter-spacing:-.01em}
#banner{border-radius:12px;padding:18px 22px;font-size:18px;font-weight:600;color:#fff;background:var(--none);display:flex;align-items:center;gap:12px}
#banner.ok{background:var(--ok)}#banner.degraded,#banner.partial{background:var(--part)}#banner.down{background:var(--down)}
@media(prefers-color-scheme:dark){#banner.ok,#banner.degraded,#banner.partial,#banner.down{color:#0f1214}}
#banner i{width:12px;height:12px;border-radius:50%;background:currentColor;flex:none;opacity:.85}
.grp{margin:30px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:22px}
.grp+.box{margin-top:0}
.c{padding:16px 20px;border-bottom:1px solid var(--line)}
.c:last-child{border-bottom:0}
.top{display:flex;align-items:baseline;gap:10px}
.top b{font-weight:600}
.st{margin-left:auto;font-size:14px;font-weight:500}
.st.ok{color:var(--ok)}.st.partial{color:var(--part)}.st.down{color:var(--down)}
.bars{display:flex;gap:2px;height:32px;margin:10px 0 6px}
.bars i{flex:1;border-radius:2px;background:var(--none);min-width:2px}
.bars i.ok{background:var(--ok)}.bars i.partial{background:var(--part)}.bars i.down{background:var(--down)}
.bars i:hover{opacity:.7}
.leg{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;white-space:nowrap;display:none;z-index:2}
footer{margin-top:26px;font-size:13px;color:var(--mut);text-align:center}
.empty{padding:28px 20px;color:var(--mut);text-align:center}
@media(max-width:600px){main{padding:24px 14px 40px}.bars{gap:1px;height:28px}.c{padding:14px}}
</style>
</head>
<body>
<main>
  <h1 id="title">Status usług</h1>
  <div id="banner"><i></i><span>Wczytuję…</span></div>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>
<div id="tip"></div>
<script>
// strona tylko czyta plik status.json (generowany co minute przez centrale); nie ma tu zadnych danych o maszynach
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const STATE={ok:'Działa',partial:'Działa z problemami',down:'Nie działa'};
const BANNER={ok:'Wszystkie usługi działają',degraded:'Część usług działa z problemami',partial:'Część usług nie działa',down:'Usługi nie działają',none:'Brak danych o usługach'};
const pct=v=>v==null?'brak danych':(v>=99.995?'100':v.toFixed(v>=99.9?3:2).replace(/0+$/,'').replace(/\.$/,'')).replace('.',',')+'%';
const dname=d=>new Date(d+'T12:00:00').toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'long'});
const tip=$('#tip');
function show(e,t){tip.textContent=t;tip.style.display='block';const r=e.target.getBoundingClientRect();tip.style.left=Math.max(6,Math.min(innerWidth-tip.offsetWidth-6,r.left+r.width/2-tip.offsetWidth/2))+'px';tip.style.top=(r.top-tip.offsetHeight-8)+'px'}
function render(d){
  document.title=d.title||'Status usług';$('#title').textContent=d.title||'Status usług';
  const b=$('#banner');b.className=d.overall||'none';b.querySelector('span').textContent=BANNER[d.overall]||BANNER.none;
  const list=$('#list');list.textContent='';
  const comps=d.components||[];
  if(!comps.length){const x=el('div','box');x.append(el('div','empty','Strona statusu nie ma jeszcze żadnych usług.'));list.append(x)}
  let box=null,grp=null;
  for(const c of comps){
    if(!box||c.group!==grp){grp=c.group;if(grp)list.append(el('div','grp',grp));box=el('div','box');list.append(box)}
    const r=el('div','c'),top=el('div','top');
    top.append(el('b','',c.name),el('span','st '+c.state,STATE[c.state]||''));
    const bars=el('div','bars');
    for(const [day,s,p] of c.days||[]){
      const i=el('i',s);const t=dname(day)+' · '+(s==='none'?'brak danych':'dostępność '+pct(p));
      i.onmouseenter=e=>show(e,t);i.onmouseleave=()=>{tip.style.display='none'};i.onclick=e=>show(e,t);i.setAttribute('aria-label',t);
      bars.append(i);
    }
    const leg=el('div','leg');leg.append(el('span','',(c.days||[]).length+' dni temu'),el('span','',pct(c.uptime)+' dostępności'),el('span','','dziś'));
    r.append(top,bars,leg);box.append(r);
  }
  const u=new Date(d.updated);
  $('#foot').textContent=isNaN(u)?'':'Ostatnia aktualizacja: '+u.toLocaleString('pl-PL',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+' · odświeża się co minutę';
}
async function load(){
  try{const r=await fetch('status.json',{cache:'no-store'});if(!r.ok)throw 0;render(await r.json())}
  catch{const b=$('#banner');if(!b.className){b.className='none';b.querySelector('span').textContent='Nie udało się wczytać statusu'}}
}
load();setInterval(load,6e4);
</script>
</body>
</html>
