# loghub: weryfikacja zmian. Uruchamia te same sprawdziany co "make check" (jedna lista plikow w Makefile).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # piny obrazu i akcji: CI ma byc odtwarzalny (przeniesienie na nowszy Ubuntu/wersje akcji jest swiadoma decyzja)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # piny narzedzi wg Makefile (one sa prawda): shellcheck 0.11.0
      - name: shellcheck 0.11.0
        run: |
          curl -sSL -o sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar xJf sc.tar.xz
          sudo install -m 755 shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      # piny narzedzi wg Makefile (one sa prawda): python 3.13, black 26.10.1, node 22 (prettier 3.6.2 przez npx)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "black==26.10.1"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: make check
